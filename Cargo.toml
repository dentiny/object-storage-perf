[package]
name = "object-storage-perf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
hdrhistogram = { version = "7.6.0", default-features = false, features = ["sync"] }
opendal = { version = "0.58.1", features = ["services-s3"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
